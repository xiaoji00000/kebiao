<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>曾文林的硬核课表</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f5f7fa; --card: #fff; --text: #333; --sec: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 20px; }
        
        .header { background: var(--primary); color: #fff; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .week-switcher { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 5px; }
        .week-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 15px; border-radius: 15px; font-size: 18px; cursor: pointer; }
        .week-info { font-size: 20px; font-weight: bold; min-width: 80px; }
        .date-info { font-size: 12px; opacity: 0.8; }

        .day-bar { display: flex; background: #fff; padding: 12px 0; border-bottom: 1px solid #eee; position: sticky; top: 82px; z-index: 99; }
        .day-item { flex: 1; text-align: center; font-size: 14px; color: var(--sec); cursor: pointer; position: relative; }
        .day-item.active { color: var(--primary); font-weight: bold; }
        .day-item.active::after { content: ''; position: absolute; bottom: -12px; left: 25%; width: 50%; height: 3px; background: var(--primary); border-radius: 3px; }

        .schedule-body { padding: 15px; min-height: 400px; }
        .slot { margin-bottom: 15px; display: flex; align-items: flex-start; }
        
        /* 修复显示不全的关键：固定时间轴宽度 */
        .time-axis { width: 75px; flex-shrink: 0; font-size: 12px; color: var(--sec); text-align: center; margin-right: 10px; }
        .time-start { font-weight: bold; color: var(--text); font-size: 15px; display: block; }
        .time-end { font-size: 11px; opacity: 0.7; }

        .course-card { flex-grow: 1; background: var(--card); border-radius: 12px; padding: 12px; border-left: 5px solid var(--primary); box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .c-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; display: block; color: #222; }
        .c-info { font-size: 12px; color: var(--sec); line-height: 1.6; }
        .c-loc { color: #e67e22; font-weight: bold; margin-right: 10px; }

        .color1 { border-left-color: #4a90e2; background: #f0f7ff; }
        .color2 { border-left-color: #e74c3c; background: #fff5f5; }
        .color3 { border-left-color: #2ecc71; background: #f2fff7; }
        .color4 { border-left-color: #f39c12; background: #fffaf0; }
        .color5 { border-left-color: #9b59b6; background: #faf5ff; }

        .empty-state { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <div class="week-switcher">
        <button class="week-btn" onclick="changeWeek(-1)">❮</button>
        <div class="week-info" id="week-display">第 7 周</div>
        <button class="week-btn" onclick="changeWeek(1)">❯</button>
    </div>
    <div class="date-info" id="date-display">2026年4月7日</div>
</div>

<div class="day-bar" id="day-bar">
    <div class="day-item" onclick="switchDay(1)">周一</div>
    <div class="day-item" onclick="switchDay(2)">周二</div>
    <div class="day-item" onclick="switchDay(3)">周三</div>
    <div class="day-item" onclick="switchDay(4)">周四</div>
    <div class="day-item" onclick="switchDay(5)">周五</div>
</div>

<div id="schedule-body" class="schedule-body"></div>

<script>
    // 初始化时间逻辑 [cite: 2026-03-27]
    const TERM_START = new Date('2026-02-23'); 
    const now = new Date();
    let displayWeek = Math.max(1, Math.ceil((now - TERM_START) / (7 * 24 * 60 * 60 * 1000)));
    let displayDay = now.getDay() === 0 || now.getDay() > 5 ? 1 : now.getDay();

    const courses = [
        { n: "图学基础", l: "致理A104", d: 1, s: 4, e: 5, w: [1,6], t: "10:40~12:15", c: "color4" },
        { n: "程设基础(Ⅱ)", l: "致真A216", d: 1, s: 6, e: 7, w: [1,12], t: "14:00~15:35", c: "color1" },
        { n: "高数(Ⅱ)", l: "格物C201", d: 1, s: 8, e: 10, w: [1,16], t: "15:50~18:15", c: "color3" },
        { n: "心理健康", l: "工训阶3", d: 1, s: 11, e: 13, w: [1,6], t: "19:00~21:15", c: "color5" },
        { n: "军事理论", l: "工训阶2", d: 2, s: 1, e: 3, w: [1,11], t: "08:00~10:15", c: "color1" },
        { n: "高数(Ⅱ)", l: "格物C201", d: 2, s: 4, e: 5, w: [1,16], t: "10:40~12:15", c: "color3" },
        { n: "线性代数", l: "致理A108", d: 2, s: 6, e: 7, w: [1,10], t: "14:00~15:35", c: "color2" },
        { n: "口译入门", l: "致理A122", d: 2, s: 8, e: 9, w: [1,16], t: "15:50~17:25", c: "color4" },
        { n: "大学物理(Ⅰ)", l: "格物C301", d: 3, s: 1, e: 3, w: [1,12], t: "08:00~10:15", c: "color2" },
        { n: "图学基础", l: "致理A104", d: 3, s: 4, e: 5, w: [1,6], t: "10:40~12:15", c: "color4" },
        { n: "物理辅导", l: "格物C301", d: 3, s: 6, e: 7, w: [2,10], t: "14:00~15:35", c: "color5" },
        { n: "物理实验", l: "江阴校区", d: 3, s: 11, e: 13, w: [1,15], t: "19:00~21:15", c: "color1" },
        { n: "史纲", l: "致道A106", d: 4, s: 1, e: 3, w: [4,4], t: "08:00~10:15", c: "color4" },
        { n: "高数(Ⅱ)", l: "格物C201", d: 4, s: 4, e: 5, w: [1,16], t: "10:40~12:15", c: "color3" },
        { n: "学术英语", l: "致远A108", d: 4, s: 6, e: 7, w: [1,16], t: "14:00~15:35", c: "color1" },
        { n: "线性代数", l: "致理A108", d: 4, s: 8, e: 9, w: [1,10], t: "15:50~17:25", c: "color2" },
        { n: "史纲", l: "致理A112", d: 5, s: 1, e: 3, w: [1,14], t: "08:00~10:15", c: "color4" },
        { n: "大学物理(Ⅰ)", l: "格物C301", d: 5, s: 4, e: 5, w: [1,12], t: "10:40~12:15", c: "color2" },
        { n: "形策(Ⅱ)", l: "格物C104", d: 5, s: 6, e: 7, w: [5,8], t: "14:00~15:35", c: "color5" },
        { n: "体育(Ⅱ)", l: "运动场", d: 5, s: 8, e: 9, w: [1,16], t: "15:50~17:25", c: "color3" }
    ];

    function changeWeek(delta) {
        displayWeek = Math.max(1, Math.min(20, displayWeek + delta));
        render();
    }

    function switchDay(d) {
        displayDay = d;
        render();
    }

    function render() {
        document.getElementById('week-display').innerText = `第 ${displayWeek} 周`;
        document.getElementById('date-display').innerText = now.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
        
        // 更新星期高亮
        const items = document.querySelectorAll('.day-item');
        items.forEach((item, idx) => {
            item.classList.toggle('active', idx + 1 === displayDay);
        });

        const container = document.getElementById('schedule-body');
        container.innerHTML = '';
        
        // 过滤逻辑：匹配星期 + 匹配当前周是否在开课范围内 [cite: 19-61]
        const filtered = courses.filter(c => c.d === displayDay && displayWeek >= c.w[0] && displayWeek <= c.w[1])
                                .sort((a,b) => a.s - b.s);

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">本周该日暂无课程</div>';
            return;
        }

        filtered.forEach(c => {
            const [startT, endT] = c.t.split('~');
            container.innerHTML += `
                <div class="slot">
                    <div class="time-axis">
                        <span class="time-start">${startT}</span>
                        <span class="time-end">${endT}</span>
                    </div>
                    <div class="course-card ${c.c}">
                        <span class="c-name">${c.n}</span>
                        <div class="c-info">
                            <span class="c-loc">📍 ${c.l}</span>
                            <span>📅 第${c.s}-${c.e}节 | ${c.w[0]}-${c.w[1]}周</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    render();
</script>
</body>
</html>
